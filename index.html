<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stampa3D Manager V2</title>
<meta name="theme-color" content="#E8650A">
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#E8650A;color:white;padding:18px;text-align:center}
.container{max-width:600px;margin:auto;padding:12px}
.card{background:white;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h3{margin-top:0}
input,select{width:100%;padding:10px;margin-top:4px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;border:none;border-radius:10px;background:#E8650A;color:white;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{font-size:22px;font-weight:bold}
.result{background:#fff3eb;padding:10px;border-radius:10px}
.total{font-size:28px;color:#E8650A;font-weight:bold}
.small{color:#666;font-size:13px}
</style>
</head>
<body>
<header>
<h2>🖨️ Stampa3D Manager V2</h2>
<div>Preventivi • Magazzino • Statistiche</div>
</header>

<div class="container">

<div class="card">
<h3>📊 Dashboard</h3>
<div class="grid">
<div><div class="stat" id="matCount">0</div><div class="small">Materiali</div></div>
<div><div class="stat" id="jobCount">0</div><div class="small">Stampe</div></div>
</div>
</div>

<div class="card">
<h3>📦 Nuovo materiale</h3>
<input id="brand" placeholder="Marca">
<input id="type" placeholder="PLA / PETG / TPU">
<input id="color" placeholder="Colore">
<input id="weight" type="number" placeholder="Peso totale (g)">
<input id="cost" type="number" step="0.01" placeholder="Costo acquisto (€)">
<button onclick="addMaterial()">Salva materiale</button>
</div>

<div class="card">
<h3>💰 Preventivo</h3>
<select id="material"></select>
<input id="project" placeholder="Nome progetto">
<input id="grams" type="number" placeholder="Grammi utilizzati">
<input id="hours" type="number" step="0.1" placeholder="Ore stampa">
<input id="margin" type="number" value="50" placeholder="Margine %">
<button onclick="calculate()">Calcola</button>
<div id="result" style="display:none" class="result">
<div>Costo materiale: <span id="matCost"></span></div>
<div>Energia: <span id="energyCost"></span></div>
<div>Usura macchina: <span id="wearCost"></span></div>
<hr>
<div>Costo reale: <b id="realCost"></b></div>
<div>Prezzo consigliato: <span class="total" id="sellPrice"></span></div>
</div>
</div>

</div>

<script>
let materials = JSON.parse(localStorage.getItem("materials")||"[]");
let jobs = JSON.parse(localStorage.getItem("jobs")||"[]");

function save(){
 localStorage.setItem("materials",JSON.stringify(materials));
 localStorage.setItem("jobs",JSON.stringify(jobs));
}

function refresh(){
 document.getElementById("matCount").innerText=materials.length;
 document.getElementById("jobCount").innerText=jobs.length;

 let s=document.getElementById("material");
 s.innerHTML="";
 materials.forEach((m,i)=>{
   let o=document.createElement("option");
   o.value=i;
   o.textContent=`${m.brand} ${m.type} (${m.color})`;
   s.appendChild(o);
 });
}

function addMaterial(){
 let m={
  brand:brand.value,
  type:type.value,
  color:color.value,
  weight:+weight.value,
  remaining:+weight.value,
  cost:+cost.value
 };
 materials.push(m);
 save();
 refresh();
 alert("Materiale salvato");
}

function calculate(){
 if(materials.length===0){alert("Inserisci almeno un materiale");return;}
 let m=materials[material.value];
 let gramsUsed=+grams.value||0;
 let hoursUsed=+hours.value||0;
 let marginPct=+margin.value||0;

 let costPerGram=m.cost/m.weight;
 let materialCost=gramsUsed*costPerGram;
 let energyCost=hoursUsed*0.05;
 let wearCost=hoursUsed*0.20;

 let real=materialCost+energyCost+wearCost;
 let finalPrice=real*(1+marginPct/100);

 matCost.innerText="€"+materialCost.toFixed(2);
 energyCostEl= document.getElementById("energyCost");
 energyCostEl.innerText="€"+energyCost.toFixed(2);
 wearCostEl=document.getElementById("wearCost");
 wearCostEl.innerText="€"+wearCost.toFixed(2);
 realCost.innerText="€"+real.toFixed(2);
 sellPrice.innerText="€"+finalPrice.toFixed(2);

 result.style.display="block";

 jobs.push({project:project.value,real:real,final:finalPrice});
 save();
 refresh();
}
refresh();
</script>
</body>
</html>
