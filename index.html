
<h2 class="sr-only">App gestione stampa 3D: magazzino materiali e calcolo costi per stampa</h2>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange: #E8650A;
  --orange-light: #FDF0E8;
  --orange-dark: #A8470A;
  --bg: var(--color-background-primary);
  --bg2: var(--color-background-secondary);
  --bg3: var(--color-background-tertiary);
  --t1: var(--color-text-primary);
  --t2: var(--color-text-secondary);
  --t3: var(--color-text-tertiary);
  --border: var(--color-border-tertiary);
  --border2: var(--color-border-secondary);
  --radius: var(--border-radius-md);
  --radius-lg: var(--border-radius-lg);
  --success-bg: var(--color-background-success);
  --success-t: var(--color-text-success);
  --warn-bg: var(--color-background-warning);
  --warn-t: var(--color-text-warning);
  --danger-bg: var(--color-background-danger);
  --danger-t: var(--color-text-danger);
}
body { font-family: var(--font-sans); background: var(--bg3); }
#app { max-width: 420px; margin: 0 auto; background: var(--bg3); min-height: 100vh; }

/* Top bar */
.topbar { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 14px 16px 10px; position: sticky; top: 0; z-index: 10; }
.topbar-title { font-size: 18px; font-weight: 500; color: var(--t1); }
.topbar-sub { font-size: 12px; color: var(--t2); margin-top: 2px; }

/* Nav tabs */
.nav { display: flex; background: var(--bg); border-bottom: 0.5px solid var(--border); }
.nav-btn { flex: 1; padding: 10px 4px 8px; border: none; background: none; cursor: pointer; font-size: 11px; color: var(--t2); display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.15s; }
.nav-btn i { font-size: 20px; }
.nav-btn.active { color: var(--orange); border-bottom: 2px solid var(--orange); }

/* Sections */
.section { display: none; padding: 16px; }
.section.active { display: block; }

/* Cards */
.card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 12px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.card-title { font-size: 15px; font-weight: 500; color: var(--t1); }

/* Material card */
.mat-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 10px; }
.mat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.mat-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.mat-name { font-size: 15px; font-weight: 500; color: var(--t1); }
.mat-type { font-size: 12px; color: var(--t2); }
.mat-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat-box { background: var(--bg2); border-radius: var(--radius); padding: 8px 10px; }
.stat-label { font-size: 11px; color: var(--t2); }
.stat-value { font-size: 15px; font-weight: 500; color: var(--t1); margin-top: 2px; }
.progress-bar { height: 6px; background: var(--bg2); border-radius: 3px; margin: 10px 0 6px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.progress-label { font-size: 11px; color: var(--t2); display: flex; justify-content: space-between; }
.badge { font-size: 11px; padding: 3px 8px; border-radius: var(--radius); font-weight: 500; }
.badge-ok { background: var(--success-bg); color: var(--success-t); }
.badge-warn { background: var(--warn-bg); color: var(--warn-t); }
.badge-low { background: var(--danger-bg); color: var(--danger-t); }
.delete-btn { background: none; border: none; cursor: pointer; color: var(--t3); padding: 4px; font-size: 16px; }
.delete-btn:hover { color: var(--danger-t); }

/* Form */
.form-group { margin-bottom: 12px; }
.form-label { font-size: 12px; color: var(--t2); margin-bottom: 4px; display: block; }
input, select { width: 100%; height: 38px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--t1); font-size: 14px; padding: 0 10px; font-family: var(--font-sans); }
input[type="color"] { height: 38px; padding: 4px 6px; cursor: pointer; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.btn { width: 100%; height: 40px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: none; color: var(--t1); font-size: 14px; cursor: pointer; font-family: var(--font-sans); transition: background 0.15s; }
.btn:hover { background: var(--bg2); }
.btn-primary { background: var(--orange); color: #fff; border-color: var(--orange); font-weight: 500; }
.btn-primary:hover { background: var(--orange-dark); border-color: var(--orange-dark); }

/* Calculator */
.calc-result { background: var(--bg2); border-radius: var(--radius-lg); padding: 14px 16px; margin-top: 16px; }
.calc-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 0.5px solid var(--border); }
.calc-row:last-child { border-bottom: none; }
.calc-label { font-size: 13px; color: var(--t2); }
.calc-val { font-size: 14px; font-weight: 500; color: var(--t1); }
.calc-total { font-size: 18px; font-weight: 500; color: var(--orange); }
.total-label { font-size: 14px; color: var(--t1); font-weight: 500; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; }
.stat-card-label { font-size: 11px; color: var(--t2); }
.stat-card-value { font-size: 20px; font-weight: 500; color: var(--t1); margin-top: 4px; }
.history-item { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.history-left .h-name { font-size: 14px; font-weight: 500; color: var(--t1); }
.history-left .h-meta { font-size: 12px; color: var(--t2); margin-top: 2px; }
.history-cost { font-size: 16px; font-weight: 500; color: var(--orange); }

/* Empty state */
.empty { text-align: center; padding: 40px 20px; color: var(--t2); font-size: 14px; }
.empty i { font-size: 40px; color: var(--t3); margin-bottom: 10px; display: block; }

/* Section title */
.section-title { font-size: 13px; font-weight: 500; color: var(--t2); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 12px; }

/* Toggle form */
.add-toggle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.add-form { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 16px; }
.form-hidden { display: none; }

/* Printer settings */
.settings-note { font-size: 12px; color: var(--t2); margin-top: 4px; }
</style>

<div id="app">
  <div class="topbar">
    <div class="topbar-title"><i class="ti ti-printer" aria-hidden="true" style="color:var(--orange);margin-right:6px;font-size:20px;vertical-align:-3px"></i>Stampa 3D</div>
    <div class="topbar-sub">Gestione materiali & costi</div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="showTab('magazzino')" id="tab-magazzino">
      <i class="ti ti-package" aria-hidden="true"></i>Magazzino
    </button>
    <button class="nav-btn" onclick="showTab('calcola')" id="tab-calcola">
      <i class="ti ti-calculator" aria-hidden="true"></i>Calcola
    </button>
    <button class="nav-btn" onclick="showTab('storico')" id="tab-storico">
      <i class="ti ti-history" aria-hidden="true"></i>Storico
    </button>
    <button class="nav-btn" onclick="showTab('impostazioni')" id="tab-impostazioni">
      <i class="ti ti-settings" aria-hidden="true"></i>Imposta
    </button>
  </div>

  <!-- MAGAZZINO -->
  <div class="section active" id="section-magazzino">
    <div class="add-toggle">
      <span class="section-title" style="margin:0">Filamenti & resine</span>
      <button class="btn btn-primary" onclick="toggleAddForm()" id="add-btn" style="width:auto;padding:0 14px;height:34px;font-size:13px">
        <i class="ti ti-plus" aria-hidden="true"></i> Aggiungi
      </button>
    </div>

    <div class="add-form form-hidden" id="add-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Marca</label>
          <input type="text" id="f-brand" placeholder="es. Bambu Lab">
        </div>
        <div class="form-group">
          <label class="form-label">Tipo</label>
          <select id="f-type">
            <option>PLA</option><option>PETG</option><option>ABS</option><option>TPU</option>
            <option>ASA</option><option>Resina UV</option><option>Altro</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Colore</label>
          <input type="color" id="f-color" value="#e63946">
        </div>
        <div class="form-group">
          <label class="form-label">Nome colore</label>
          <input type="text" id="f-colorname" placeholder="es. Rosso">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Peso totale (g)</label>
          <input type="number" id="f-weight" placeholder="1000" min="1">
        </div>
        <div class="form-group">
          <label class="form-label">Costo acquisto (€)</label>
          <input type="number" id="f-cost" placeholder="22.50" step="0.01" min="0">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Peso rimanente (g)</label>
        <input type="number" id="f-remaining" placeholder="Uguale al peso totale">
      </div>
      <button class="btn btn-primary" onclick="addMaterial()">Salva materiale</button>
    </div>

    <div id="materials-list"></div>
  </div>

  <!-- CALCOLA -->
  <div class="section" id="section-calcola">
    <div class="section-title">Calcola costo stampa</div>
    <div class="card">
      <div class="form-group">
        <label class="form-label">Nome stampa</label>
        <input type="text" id="c-name" placeholder="es. Supporto smartphone">
      </div>
      <div class="form-group">
        <label class="form-label">Materiale usato</label>
        <select id="c-material"></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Grammi usati</label>
          <input type="number" id="c-grams" placeholder="45" min="0" step="0.1" oninput="calcCost()">
        </div>
        <div class="form-group">
          <label class="form-label">Ore di stampa</label>
          <input type="number" id="c-hours" placeholder="3.5" min="0" step="0.1" oninput="calcCost()">
        </div>
      </div>
    </div>

    <div class="calc-result" id="calc-result" style="display:none">
      <div class="calc-row">
        <span class="calc-label"><i class="ti ti-package" aria-hidden="true" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Costo materiale</span>
        <span class="calc-val" id="r-material">—</span>
      </div>
      <div class="calc-row">
        <span class="calc-label"><i class="ti ti-bolt" aria-hidden="true" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Elettricità</span>
        <span class="calc-val" id="r-electricity">—</span>
      </div>
      <div class="calc-row">
        <span class="calc-label"><i class="ti ti-tool" aria-hidden="true" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Ammortamento</span>
        <span class="calc-val" id="r-depreciation">—</span>
      </div>
      <div class="calc-row" style="margin-top:4px;padding-top:10px;border-top:0.5px solid var(--border)">
        <span class="total-label">Totale</span>
        <span class="calc-total" id="r-total">—</span>
      </div>
    </div>

    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn" onclick="calcCost()" style="flex:1">Calcola</button>
      <button class="btn btn-primary" onclick="saveJob()" style="flex:1">Salva nel storico</button>
    </div>
    <div id="calc-msg" style="font-size:12px;color:var(--success-t);margin-top:8px;text-align:center"></div>
  </div>

  <!-- STORICO -->
  <div class="section" id="section-storico">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="section-title">Stampe salvate</div>
    <div id="history-list"></div>
  </div>

  <!-- IMPOSTAZIONI -->
  <div class="section" id="section-impostazioni">
    <div class="section-title">Stampante</div>
    <div class="card">
      <div class="form-group">
        <label class="form-label">Potenza stampante (Watt)</label>
        <input type="number" id="s-watts" value="200" min="1" oninput="saveSettings()">
        <div class="settings-note">Media tipica: 100–250W</div>
      </div>
      <div class="form-group">
        <label class="form-label">Costo elettricità (€/kWh)</label>
        <input type="number" id="s-kwh" value="0.25" step="0.01" min="0" oninput="saveSettings()">
        <div class="settings-note">Tariffa italiana media: ~0.25 €/kWh</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Costo stampante (€)</label>
          <input type="number" id="s-printercost" value="400" min="0" oninput="saveSettings()">
        </div>
        <div class="form-group">
          <label class="form-label">Vita stimata (ore)</label>
          <input type="number" id="s-lifespan" value="2000" min="1" oninput="saveSettings()">
        </div>
      </div>
    </div>
    <div class="section-title" style="margin-top:16px">Dati</div>
    <div class="card">
      <button class="btn" onclick="exportData()" style="margin-bottom:10px">
        <i class="ti ti-download" aria-hidden="true"></i> Esporta dati (JSON)
      </button>
      <button class="btn" onclick="clearData()" style="color:var(--danger-t)">
        <i class="ti ti-trash" aria-hidden="true"></i> Cancella tutti i dati
      </button>
    </div>
  </div>
</div>

<script>
let materials = JSON.parse(localStorage.getItem('3dp_materials') || '[]');
let jobs = JSON.parse(localStorage.getItem('3dp_jobs') || '[]');
let settings = JSON.parse(localStorage.getItem('3dp_settings') || '{"watts":200,"kwh":0.25,"printercost":400,"lifespan":2000}');

function save() {
  localStorage.setItem('3dp_materials', JSON.stringify(materials));
  localStorage.setItem('3dp_jobs', JSON.stringify(jobs));
}

function showTab(t) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + t).classList.add('active');
  document.getElementById('tab-' + t).classList.add('active');
  if (t === 'calcola') refreshCalcSelect();
  if (t === 'storico') renderHistory();
  if (t === 'impostazioni') loadSettings();
}

function toggleAddForm() {
  const f = document.getElementById('add-form');
  f.classList.toggle('form-hidden');
}

function addMaterial() {
  const brand = document.getElementById('f-brand').value.trim();
  const type = document.getElementById('f-type').value;
  const color = document.getElementById('f-color').value;
  const colorname = document.getElementById('f-colorname').value.trim() || 'Senza nome';
  const weight = parseFloat(document.getElementById('f-weight').value);
  const cost = parseFloat(document.getElementById('f-cost').value);
  const remVal = document.getElementById('f-remaining').value;
  const remaining = remVal ? parseFloat(remVal) : weight;
  if (!brand || !weight || !cost) { alert('Compila marca, peso e costo.'); return; }
  materials.push({ id: Date.now(), brand, type, color, colorname, weight, remaining, cost });
  save();
  renderMaterials();
  document.getElementById('add-form').classList.add('form-hidden');
  ['f-brand','f-colorname','f-weight','f-cost','f-remaining'].forEach(id => document.getElementById(id).value = '');
}

function deleteMaterial(id) {
  if (!confirm('Eliminare questo materiale?')) return;
  materials = materials.filter(m => m.id !== id);
  save();
  renderMaterials();
}

function renderMaterials() {
  const el = document.getElementById('materials-list');
  if (!materials.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-package" aria-hidden="true"></i>Nessun materiale. Aggiungi il tuo primo filamento!</div>';
    return;
  }
  el.innerHTML = materials.map(m => {
    const pct = Math.round((m.remaining / m.weight) * 100);
    const cpg = (m.cost / m.weight).toFixed(4);
    let badgeClass = pct > 30 ? 'badge-ok' : pct > 10 ? 'badge-warn' : 'badge-low';
    let barColor = pct > 30 ? 'var(--color-background-success)' : pct > 10 ? 'var(--color-background-warning)' : 'var(--color-background-danger)';
    return `<div class="mat-card">
      <div class="mat-header">
        <div class="mat-dot" style="background:${m.color}"></div>
        <div style="flex:1">
          <div class="mat-name">${m.brand} · ${m.type}</div>
          <div class="mat-type">${m.colorname}</div>
        </div>
        <span class="badge ${badgeClass}">${pct}%</span>
        <button class="delete-btn" onclick="deleteMaterial(${m.id})" aria-label="Elimina"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="progress-label"><span>${m.remaining.toFixed(0)}g rimasti</span><span>${m.weight}g totali</span></div>
      <div class="mat-stats" style="margin-top:8px">
        <div class="stat-box"><div class="stat-label">Costo acquisto</div><div class="stat-value">€${m.cost.toFixed(2)}</div></div>
        <div class="stat-box"><div class="stat-label">Costo/grammo</div><div class="stat-value">€${cpg}</div></div>
      </div>
    </div>`;
  }).join('');
}

function refreshCalcSelect() {
  const sel = document.getElementById('c-material');
  sel.innerHTML = materials.length
    ? materials.map(m => `<option value="${m.id}">${m.brand} ${m.type} – ${m.colorname}</option>`).join('')
    : '<option value="">— Aggiungi prima un materiale —</option>';
}

function calcCost() {
  const grams = parseFloat(document.getElementById('c-grams').value) || 0;
  const hours = parseFloat(document.getElementById('c-hours').value) || 0;
  const matId = parseInt(document.getElementById('c-material').value);
  const mat = materials.find(m => m.id === matId);
  if (!mat || (!grams && !hours)) { document.getElementById('calc-result').style.display = 'none'; return; }
  const cpg = mat.cost / mat.weight;
  const matCost = grams * cpg;
  const elecCost = hours * (settings.watts / 1000) * settings.kwh;
  const deprCost = hours * (settings.printercost / settings.lifespan);
  const total = matCost + elecCost + deprCost;
  document.getElementById('r-material').textContent = '€' + matCost.toFixed(3);
  document.getElementById('r-electricity').textContent = '€' + elecCost.toFixed(3);
  document.getElementById('r-depreciation').textContent = '€' + deprCost.toFixed(3);
  document.getElementById('r-total').textContent = '€' + total.toFixed(2);
  document.getElementById('calc-result').style.display = 'block';
  return { matCost, elecCost, deprCost, total };
}

function saveJob() {
  const result = calcCost();
  if (!result) { alert('Inserisci i dati e calcola prima.'); return; }
  const name = document.getElementById('c-name').value.trim() || 'Stampa senza nome';
  const grams = parseFloat(document.getElementById('c-grams').value) || 0;
  const hours = parseFloat(document.getElementById('c-hours').value) || 0;
  const matId = parseInt(document.getElementById('c-material').value);
  const mat = materials.find(m => m.id === matId);
  jobs.unshift({ id: Date.now(), name, date: new Date().toLocaleDateString('it-IT'), grams, hours, matName: mat ? `${mat.brand} ${mat.type}` : '—', ...result });
  // Deduct from material
  if (mat) { mat.remaining = Math.max(0, mat.remaining - grams); save(); renderMaterials(); }
  save();
  const msg = document.getElementById('calc-msg');
  msg.textContent = '✓ Salvato! Materiale aggiornato.';
  setTimeout(() => msg.textContent = '', 2500);
}

function renderHistory() {
  const totalJobs = jobs.length;
  const totalCost = jobs.reduce((s, j) => s + j.total, 0);
  const totalHours = jobs.reduce((s, j) => s + j.hours, 0);
  const totalGrams = jobs.reduce((s, j) => s + j.grams, 0);
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-card-label">Stampe totali</div><div class="stat-card-value">${totalJobs}</div></div>
    <div class="stat-card"><div class="stat-card-label">Spesa totale</div><div class="stat-card-value">€${totalCost.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-card-label">Ore di stampa</div><div class="stat-card-value">${totalHours.toFixed(1)}h</div></div>
    <div class="stat-card"><div class="stat-card-label">Filamento usato</div><div class="stat-card-value">${totalGrams.toFixed(0)}g</div></div>
  `;
  const el = document.getElementById('history-list');
  if (!jobs.length) { el.innerHTML = '<div class="empty"><i class="ti ti-history" aria-hidden="true"></i>Nessuna stampa salvata ancora.</div>'; return; }
  el.innerHTML = jobs.map(j => `
    <div class="history-item">
      <div class="history-left">
        <div class="h-name">${j.name}</div>
        <div class="h-meta">${j.date} · ${j.matName} · ${j.grams}g · ${j.hours}h</div>
      </div>
      <div class="history-cost">€${j.total.toFixed(2)}</div>
    </div>
  `).join('');
}

function loadSettings() {
  document.getElementById('s-watts').value = settings.watts;
  document.getElementById('s-kwh').value = settings.kwh;
  document.getElementById('s-printercost').value = settings.printercost;
  document.getElementById('s-lifespan').value = settings.lifespan;
}

function saveSettings() {
  settings = {
    watts: parseFloat(document.getElementById('s-watts').value) || 200,
    kwh: parseFloat(document.getElementById('s-kwh').value) || 0.25,
    printercost: parseFloat(document.getElementById('s-printercost').value) || 400,
    lifespan: parseFloat(document.getElementById('s-lifespan').value) || 2000
  };
  localStorage.setItem('3dp_settings', JSON.stringify(settings));
}

function exportData() {
  const data = { materials, jobs, settings, exported: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'stampa3d_backup.json'; a.click();
}

function clearData() {
  if (!confirm('Cancellare TUTTI i dati? Questa azione non è reversibile.')) return;
  materials = []; jobs = []; save(); renderMaterials(); renderHistory();
}

renderMaterials();
